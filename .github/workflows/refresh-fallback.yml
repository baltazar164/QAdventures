# Keeps the site's offline copy of the catalog fresh.
#
# It matters only while Odoo is unreachable: the page fetches the live catalog on
# every load, so a visitor normally never sees this file. Once a day is the agreed
# cadence — the copy is a safety net for the few hours a year the backend is down,
# and refreshing it more often would mean hundreds of commits a day, permanently,
# in a public repository, to buy freshness nobody would ever notice.

name: Refresh the offline catalog

on:
  schedule:
    # 02:20 UTC ≈ 10:20 in Cebu — after the shop's morning edits, before nobody is
    # awake to notice a bad one. Minutes are off the hour on purpose: GitHub queues
    # everything scheduled on it, and a job that runs late runs after the hour it
    # was meant to represent.
    - cron: '20 2 * * *'
  workflow_dispatch:

# Only the commit needs write access, and only to this repository.
permissions:
  contents: write

concurrency:
  group: refresh-fallback
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the catalog and its photos
        env:
          CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
          CATALOG_API_KEY: ${{ secrets.CATALOG_API_KEY }}
        run: node tools/refresh-fallback.mjs

      - name: Commit whatever changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json images/catalog
          git commit -m "Refresh the offline catalog"
          git push

# Two things to know before relying on this.
#
# It cannot work until the server has a database with published models — plan 0006
# step 4. Until then every run will refuse to write, which is the correct outcome
# and looks like a green job that did nothing.
#
# GitHub disables scheduled workflows in a public repository after 60 days without
# repository activity, and sends one email when it does. Whether this job's own
# commits count as activity has NOT been verified — check it once the schedule has
# been live for a couple of months, because the failure mode is silence.
