# Keeps the site's offline copy of the catalog fresh.
#
# It matters only while Odoo is unreachable: the page fetches the live catalog on
# every load, so a visitor normally never sees this file. Once a day is the agreed
# cadence — the copy is a safety net for the few hours a year the backend is down,
# and refreshing it more often would mean hundreds of commits a day, permanently,
# in a public repository, to buy freshness nobody would ever notice.

name: Refresh the offline catalog

on:
  schedule:
    # 02:20 UTC ≈ 10:20 in Cebu — after the shop's morning edits, before nobody is
    # awake to notice a bad one. Minutes are off the hour on purpose: GitHub queues
    # everything scheduled on it, and a job that runs late runs after the hour it
    # was meant to represent.
    - cron: '20 2 * * *'
  # Also started by the "Update site now" button in Odoo (d21 stage 1). The
  # key Odoo holds for that may only start and read jobs, which is safe for one
  # reason: this job takes NO inputs, so whoever starts it passes nothing in and
  # everything it writes comes from Odoo's catalog. Never add `inputs:` here —
  # it would turn that key into a way to put words on the site
  # (decisions.md, 2026-10-14).
  workflow_dispatch:

# Nothing by default; each job below names what it needs.
permissions: {}

concurrency:
  group: refresh-fallback
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Only the commit needs write access, and only to this repository.
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the catalog and its photos
        env:
          CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
          CATALOG_API_KEY: ${{ secrets.CATALOG_API_KEY }}
        run: node tools/refresh-fallback.mjs

      - name: Commit whatever changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json images/catalog
          git commit -m "Refresh the offline catalog"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # The commit above reaches the live site only through this (b140): a push made
  # with the job's own token starts no other workflow, so "Publish the site" never
  # heard of it. Nothing changed — nothing to publish.
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml

  # The watchdog (d21 stage 1): a check on healthchecks.io that expects to hear
  # from this job once a day and mails the owner and Derek when it does not. A
  # failed run says so at once instead of waiting out the day — which also catches
  # GitHub switching the schedule off after 60 quiet days (see the note at the
  # bottom). No secret, no ping: a fork stays quiet. "Success" means the copy was
  # refreshed and, if it changed, published — a publish skipped for having nothing
  # to send counts as success.
  watchdog:
    needs: [refresh, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tell the watchdog
        env:
          PING_URL: ${{ secrets.HEALTHCHECK_SITE_UPDATE_URL }}
          REFRESH: ${{ needs.refresh.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          [ -n "$PING_URL" ] || exit 0
          if [ "$REFRESH" = "success" ] && { [ "$PUBLISH" = "success" ] || [ "$PUBLISH" = "skipped" ]; }; then
            suffix=""
          else
            suffix="/fail"
          fi
          curl -fsS -m 10 --retry 3 "$PING_URL$suffix" > /dev/null || echo "watchdog unreachable"

# Two things to know before relying on this.
#
# It cannot work until the server has a database with published models — plan 0006
# step 4. Until then every run will refuse to write, which is the correct outcome
# and looks like a green job that did nothing.
#
# GitHub disables scheduled workflows in a public repository after 60 days without
# repository activity, and sends one email when it does. Whether this job's own
# commits count as activity has NOT been verified — check it once the schedule has
# been live for a couple of months, because the failure mode is silence.
